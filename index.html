<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>روان یار</title>
<style>body{margin:0;font-family:Tahoma;background:#f4f7fb;color:#182033}header{background:linear-gradient(135deg,#283593,#5c6bc0);color:white;text-align:center;padding:35px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;padding:22px;border-radius:18px;margin:16px 0;box-shadow:0 8px 28px #0001}input,button{width:100%;padding:14px;margin:7px 0;border-radius:11px;border:1px solid #d7ddea;font-size:16px}button{background:#3949ab;color:#fff;border:0;font-weight:bold}.hidden{display:none}.course{border:1px solid #e2e6ef;padding:16px;border-radius:14px;margin:12px 0}audio,video{width:100%;margin-top:10px}.err{color:#b3261e}</style>
<header><h1>روان یار</h1><p>دوره‌های آموزشی روانشناسی</p></header><main class=wrap>
<section id=login class=card><h2>ورود</h2><input id=code placeholder="کد اختصاصی، مثل RY123456"><button onclick=login()>ورود به حساب</button><p id=msg></p></section>
<section id=app class="hidden card"><h2>دوره‌های فعال شما</h2><div id=courses></div></section><section id=detail class="hidden card"></section></main>
<script>
const $=x=>document.querySelector(x);const esc=s=>String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
function device(){let x=localStorage.getItem("ry_device");if(!x){x=crypto.randomUUID();localStorage.setItem("ry_device",x)}return x}
async function api(p,o={}){let r=await fetch(p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"خطا");return j}
async function login(){try{await api("/api/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code:$("#code").value,device_id:device()})});$("#login").classList.add("hidden");$("#app").classList.remove("hidden");load()}catch(e){$("#msg").className="err";$("#msg").textContent=e.message}}
async function load(){let x=await api("/api/me");$("#courses").innerHTML=x.courses.length?x.courses.map(c=>`<div class=course><h3>${esc(c.title)}</h3><p>${esc(c.description||"")}</p><button onclick=openCourse(${c.id})>ورود به دوره</button></div>`).join(""):"هنوز دوره‌ای برای شما فعال نشده است."}
async function openCourse(id){let c=await api("/api/courses/"+id);$("#detail").classList.remove("hidden");$("#detail").innerHTML=`<h2>${esc(c.title)}</h2><p>${esc(c.description||"")}</p>`+c.media.map(m=>`<div><b>${esc(m.title)}</b><div id=m${m.id}>در حال بارگذاری...</div></div>`).join("");for(const m of c.media){let r=await fetch("/api/media/"+m.id),u=URL.createObjectURL(await r.blob());$("#m"+m.id).innerHTML=m.type==="audio"?`<audio controls src="${u}"></audio>`:`<video controls playsinline src="${u}"></video>`}}
</script>
