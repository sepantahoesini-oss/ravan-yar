<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل روان یار</title>
<style>body{margin:0;background:#f3f5f9;font-family:Tahoma;color:#182033}.wrap{max-width:1050px;margin:auto;padding:18px}header{background:#18245c;color:#fff;padding:22px}section{background:#fff;padding:20px;border-radius:18px;margin:16px 0}input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #d5dbea;font:inherit}button{background:#3949ab;color:#fff;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.item{border:1px solid #e2e5ec;padding:14px;border-radius:14px}.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px}.row input{width:auto}</style>
<header><div class=wrap><h1>پنل مدیریت روان یار</h1></div></header><main class=wrap>
<section id=login><h2>ورود ادمین</h2><input id=pass type=password placeholder="رمز مدیریت"><button onclick=login()>ورود</button><p id=msg></p></section>
<div id=panel style=display:none><section><h2>ساخت کد</h2><input id=newcode placeholder="RY123456"><button onclick=addCode()>ثبت کد</button></section><section><h2>کدهای ثبت شده</h2><div id=codes class=grid></div></section><section><h2>ثبت دوره</h2><input id=title placeholder="نام دوره"><textarea id=desc placeholder="توضیحات"></textarea><button onclick=addCourse()>ثبت دوره</button></section><section><h2>دوره‌ها</h2><div id=courses class=grid></div></section></div></main>
<script>
const $=x=>document.querySelector(x),esc=s=>String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
async function api(p,o={}){let r=await fetch(p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"خطا");return j}
async function login(){try{await api("/api/admin/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("#pass").value})});$("#login").style.display="none";$("#panel").style.display="block";load()}catch(e){$("#msg").textContent=e.message}}
async function load(){let [a,b]=await Promise.all([api("/api/admin/codes"),api("/api/admin/courses")]);$("#codes").innerHTML=a.map(x=>`<div class=item><b>${x.code}</b><p>${x.device_bound_at?"دستگاه متصل شده":"دستگاه هنوز متصل نشده"}<br>دوره فعال: ${x.active_courses}</p><button onclick=manage(${x.id})>مدیریت دوره‌ها</button></div>`).join("");$("#courses").innerHTML=b.map(x=>`<div class=item><b>${esc(x.title)}</b><p>${esc(x.description||"")}<br>${x.media_count} فایل</p><input type=file id=f${x.id} accept="audio/*,video/*"><input id=t${x.id} placeholder="عنوان فایل"><button onclick=upload(${x.id})>آپلود فایل صوتی/ویدیویی</button></div>`).join("")}
async function addCode(){try{await api("/api/admin/codes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code:$("#newcode").value})});$("#newcode").value="";load()}catch(e){alert(e.message)}}
async function addCourse(){try{await api("/api/admin/courses",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title:$("#title").value,description:$("#desc").value})});$("#title").value="";$("#desc").value="";load()}catch(e){alert(e.message)}}
async function upload(id){let f=$("#f"+id).files[0];if(!f)return alert("فایل را انتخاب کنید");let d=new FormData();d.append("file",f);d.append("title",$("#t"+id).value||f.name);try{await api("/api/admin/courses/"+id+"/media",{method:"POST",body:d});alert("آپلود شد");load()}catch(e){alert(e.message)}}
async function manage(id){let cs=await api("/api/admin/codes/"+id+"/courses");let h="<h3>مدیریت دسترسی دوره‌ها</h3>"+cs.map(c=>`<label class=row><input type=checkbox id=x${c.id} ${c.active?"checked":""}>${esc(c.title)}</label>`).join("")+"<button onclick=save()>ذخیره</button>";let w=window.open("","_blank","width=500,height=700");w.document.body.dir="rtl";w.document.body.innerHTML=h;w.save=async()=>{await Promise.all(cs.map(c=>fetch("/api/admin/codes/"+id+"/courses",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({course_id:c.id,active:w.document.getElementById("x"+c.id).checked})})));w.alert("ذخیره شد");w.close()}}
</script>
